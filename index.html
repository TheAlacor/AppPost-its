<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pizarra de Post-its Interactiva</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Pantalla de Login con Google -->
  <div id="login-screen" class="login-overlay">
    <div class="login-card">
      <h2>Pizarra de Post-its</h2>
      <p>Inicia sesión para acceder a tu tablero compartido</p>
      <button id="btn-login-google" class="btn-google">
        <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.63-.06-1.25-.16-1.84H9v3.49h4.84c-.21 1.12-.85 2.08-1.81 2.72v2.26h2.92c1.71-1.57 2.69-3.88 2.69-6.63z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.81.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.71H.96v2.33C2.45 15.98 5.48 18 9 18z"/><path fill="#FBBC05" d="M3.97 10.71c-.18-.54-.28-1.11-.28-1.71s.1-1.17.28-1.71V4.96H.96C.35 6.17 0 7.55 0 9s.35 2.83.96 4.04l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.45 2.02.96 4.96l3.01 2.33c.71-2.13 2.69-3.71 5.03-3.71z"/></svg>
        Iniciar sesión con Google
      </button>
    </div>
  </div>

  <!-- Lienzo principal de la pizarra (Oculto al inicio) -->
  <main id="board" class="hidden-board"></main>

  <button id="btn-logout" class="btn-logout hidden" aria-label="Cerrar sesión">
    Cerrar sesión
  </button>

  <!-- Botón Acción Flotante (FAB) -->
  <button id="fab" aria-label="Añadir nota" class="hidden">+</button>

  <!-- Modal para Crear / Editar Nota -->
  <div id="note-modal" class="modal hidden">
    <div class="modal-content">
      <h3 id="modal-title">Nueva Nota</h3>
      <textarea id="note-text" placeholder="Escribe tu nota aquí..." rows="4"></textarea>
      
      <div class="color-picker">
        <label>Color:</label>
        <div class="color-options">
          <button class="color-btn selected" data-color="#fff59d" style="background:#fff59d;"></button>
          <button class="color-btn" data-color="#ffcc80" style="background:#ffcc80;"></button>
          <button class="color-btn" data-color="#81d4fa" style="background:#81d4fa;"></button>
          <button class="color-btn" data-color="#a5d6a7" style="background:#a5d6a7;"></button>
          <button class="color-btn" data-color="#f48fb1" style="background:#f48fb1;"></button>
        </div>
      </div>

      <div class="modal-actions">
        <button id="btn-cancel-note" class="btn-secondary">Cancelar</button>
        <button id="btn-save-note" class="btn-primary">Guardar</button>
      </div>
    </div>
  </div>

  <!-- Modal Personalizado para Confirmar Borrado -->
  <div id="confirm-modal" class="modal hidden">
    <div class="modal-content">
      <h3>¿Eliminar esta nota?</h3>
      <p>Esta acción no se puede deshacer.</p>
      <div class="modal-actions">
        <button id="btn-cancel-delete" class="btn-secondary">Cancelar</button>
        <button id="btn-confirm-delete" class="btn-danger">Eliminar</button>
      </div>
    </div>
  </div>

  <!-- SDK v9+ de Firebase (Módulos ES) -->
  <script type="module" src="app.js"></script>
</body>
</html>
